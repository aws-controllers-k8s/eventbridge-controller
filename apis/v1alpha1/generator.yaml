ignore:
  resource_names:
      # - Archive
      # - EventBus
      # - Endpoint
      - ApiDestination
      - Connection
      - PartnerEventSource
  field_paths:
      - CreateEventBusInput.DeadLetterConfig
      - CreateEventBusInput.KmsKeyIdentifier
      - CreateEventBusOutput.DeadLetterConfig
      - CreateEventBusOutput.KmsKeyIdentifier
      - Target.AppSyncParameters
      - CreateEventBusOutput.Description
      - CreateEventBusInput.Description
operations:
  PutRule:
    operation_type:
      - Create
      - Update
    resource_name: Rule
resources:
  Archive:
    fields:
      EventPattern:
        is_document: true
      Name:
        is_immutable: true
        is_required: true
      EventSourceARN:
        is_immutable: true
        is_required: true
        references:
          resource: EventBus
          path: Status.ACKResourceMetadata.ARN
    renames:
      operations:
        CreateArchive:
          input_fields:
            ArchiveName: Name
        DescribeArchive:
          input_fields:
            ArchiveName: Name
        DeleteArchive:
          input_fields:
            ArchiveName: Name
        UpdateArchive:
          input_fields:
            ArchiveName: Name
    tags:
      ignore: true # API does not support tags
    hooks:
      sdk_create_post_set_output:
        template_path: hooks/archive/sdk_create_post_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/archive/sdk_update_pre_build_request.go.tpl
      sdk_update_post_build_request:
        template_path: hooks/archive/sdk_update_post_build_request.go.tpl
    print:
      add_age_column: true
      add_synced_column: true
      additional_columns:
        - name: ARN
          json_path: .status.ackResourceMetadata.arn
          type: string
          priority: 1 # shows only in -o view
        - name: STATE
          json_path: .status.state
          type: string
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
      terminal_codes:
        - ValidationError
        - ValidationException
        - InvalidEventPatternException
  Endpoint:
    fields:
      Name:
        is_immutable: true
        is_required: true
      Description:
        compare:
          is_ignored: true
      RoleARN:
        compare:
          is_ignored: true
        references:
          service_name: iam
          resource: Role
          path: Status.ACKResourceMetadata.ARN
      EventBuses:
        compare:
          is_ignored: true
        # The Create/Update response carries the resolved event bus ARN but not
        # the generated eventBusRef companion, so writing it back over the spec
        # would drop the reference after the first reconcile.
        set:
          - method: Create
            ignore: true
          - method: Update
            ignore: true
      EventBuses.EventBusARN:
        references:
          resource: EventBus
          path: Status.ACKResourceMetadata.ARN
      ReplicationConfig:
        compare:
          is_ignored: true
      StateReason:
        is_read_only: true
        from:
          operation: DescribeEndpoint
          path: StateReason
    tags:
      ignore: true
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_create_pre_build_request:
        template_path: hooks/endpoint/sdk_create_pre_build_request.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/endpoint/sdk_create_post_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/endpoint/sdk_update_pre_build_request.go.tpl
      sdk_update_post_build_request:
        template_path: hooks/endpoint/sdk_update_post_build_request.go.tpl
      sdk_update_pre_set_output:
        template_path: hooks/endpoint/sdk_update_pre_set_output.go.tpl
      sdk_delete_pre_build_request:
        template_path: hooks/endpoint/sdk_delete_pre_build_request.go.tpl
      sdk_delete_post_request:
        template_path: hooks/endpoint/sdk_delete_post_request.go.tpl
    print:
      add_age_column: true
      add_synced_column: true
      additional_columns:
        - name: ARN
          json_path: .status.ackResourceMetadata.arn
          type: string
          priority: 1 # shows only in -o view
        - name: STATE
          json_path: .status.state
          type: string
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
      terminal_codes:
        - ValidationError
        - ValidationException
  EventBus:
    fields:
      Name:
        is_immutable: true
        is_required: true
      Tags:
        compare:
          is_ignored: true
    shortNames:
      - eb
      - bus
    print:
      add_age_column: true
      add_synced_column: true
      additional_columns:
        - name: ARN
          json_path: .status.ackResourceMetadata.arn
          type: string
          priority: 1 # shows only in -o view
    update_operation:
      custom_method_name: customUpdate
    hooks:
      delta_pre_compare:
        code: compareTags(delta, a, b)
      sdk_read_one_post_set_output:
        template_path: hooks/eventbus/sdk_read_one_post_set_output.go.tpl
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
      # no terminal code for validation errors to prevent dead-locking on delete
      # example: delete rule and bus - bus throws validation error on delete if it still has rules
      # making this terminal would leak bus resources in AWS and K8s control planes
  Rule:
    fields:
      EventPattern:
        is_document: true
      RoleARN:
        references:
          service_name: iam
          resource: Role
          path: Status.ACKResourceMetadata.ARN
      EventBusName:
        is_immutable: true # seems to not affect EventBusRef
        references:
          resource: EventBus
          path: Spec.Name
        compare:
          is_ignored: true
      scheduleExpression:
        compare:
          is_ignored: true
      Tags:
        compare:
          is_ignored: true
      Name:
        is_immutable: true
      Targets:
        custom_field:
          list_of: Target # note: does not add comment nor kube-markers to generated code
        compare:
          is_ignored: true
      Targets.RoleARN:
        references:
          service_name: iam
          resource: Role
          path: Status.ACKResourceMetadata.ARN
      # NOTE: Targets.DeadLetterConfig.Arn holds an sqs Queue ARN and would
      # otherwise be a reference, but it cannot be wired. The member is named
      # only "Arn", and the generated companion name is the field name with its
      # identifier suffix stripped plus "Ref" -- which leaves nothing here, so
      # code generation fails outright with "reference field name cannot be just
      # an identifier suffix". Wiring it would require renaming the member,
      # which is a breaking CRD change.
      Targets.RedshiftDataParameters.SecretManagerArn:
        references:
          service_name: secretsmanager
          resource: Secret
          path: Status.ACKResourceMetadata.ARN
      Targets.EcsParameters.TaskDefinitionArn:
        references:
          service_name: ecs
          resource: TaskDefinition
          path: Status.ACKResourceMetadata.ARN
      # The short name, not an ARN: the API stores and echoes back the name.
      Targets.EcsParameters.CapacityProviderStrategy.CapacityProvider:
        references:
          service_name: ecs
          resource: CapacityProvider
          path: Spec.Name
      # NOTE: Targets.EcsParameters.NetworkConfiguration.AwsvpcConfiguration.Subnets
      # (ec2 Subnet at Status.SubnetID) and .SecurityGroups (ec2 SecurityGroup at
      # Status.ID) are both genuine references, but the code-generator emits code
      # that does not compile for them. It generates the outer
      # `for f0idx, f0iter := range ko.Spec.Targets` loop and reads through
      # f0iter, but writes through `ko.Spec.Targets.ECSParameters...` -- dropping
      # the [f0idx] index -- so the assignment does not typecheck against a slice.
      #
      # The trigger is a list-of-scalars terminal sitting under one or more
      # single-struct levels below a list item. A scalar terminal at the same
      # depth is fine (TaskDefinitionArn above), and so is a list terminal that
      # carries its own index (CapacityProviderStrategy above), which is why
      # ec2-controller's IngressRules.UserIDGroupPairs.GroupID works.
      #
      # Wiring these needs a code-generator fix first.
    hooks:
      sdk_read_one_post_set_output:
        template_path: hooks/rule/sdk_read_one_post_set_output.go.tpl
      sdk_create_pre_build_request:
        template_path: hooks/rule/sdk_create_pre_build_request.go.tpl
      sdk_create_post_build_request:
        template_path: hooks/rule/sdk_create_post_build_request.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/rule/sdk_create_post_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/rule/sdk_update_pre_build_request.go.tpl
      sdk_update_post_build_request:
        template_path: hooks/rule/sdk_update_post_build_request.go.tpl
      sdk_delete_pre_build_request:
        template_path: hooks/rule/sdk_delete_pre_build_request.go.tpl
      sdk_file_end:
        template_path: hooks/rule/sdk_file_end.go.tpl
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
    shortNames:
      - er # event rule
    print:
      add_age_column: true
      add_synced_column: true
      additional_columns:
        - name: ARN
          json_path: .status.ackResourceMetadata.arn
          type: string
          priority: 1 # shows only in -o view
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
      terminal_codes:
        - InvalidEventPatternException
        - ManagedRuleException # we don't support force because those rules are not managed by ACK
        - ValidationError
        - ValidationException
